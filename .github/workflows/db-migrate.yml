name: Database Migration

on:
  push:
    branches:
      - Campus-DB-Dev      # Triggers on push to dev branch
      - Campus-DB-QA       # Triggers on push to qa branch
      - Campus-DB-Prod     # Triggers on push to main/prod branch
    paths:
      - 'db/migrations/**'  # Only runs when migration files change

jobs:
  migrate-dev:
    if: github.ref == 'refs/heads/Campus-DB-Dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Flyway Migration on DEV
        uses: flyway/flyway-action@v1
        with:
          args: migrate
        env:
          FLYWAY_URL: jdbc:mysql://${{ secrets.DEV_DB_HOST }}:3306/${{ secrets.DEV_DB_NAME }}?ssl-mode=REQUIRED
          FLYWAY_USER: ${{ secrets.DEV_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          FLYWAY_LOCATIONS: filesystem:./db/migrations

      - name: Log Migration Success
        run: echo "✅ DEV database migration completed successfully"

  migrate-qa:
    if: github.ref == 'refs/heads/Campus-DB-QA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Flyway Migration on QA
        uses: flyway/flyway-action@v1
        with:
          args: migrate
        env:
          FLYWAY_URL: jdbc:mysql://${{ secrets.QA_DB_HOST }}:3306/${{ secrets.QA_DB_NAME }}?ssl-mode=REQUIRED
          FLYWAY_USER: ${{ secrets.QA_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          FLYWAY_LOCATIONS: filesystem:./db/migrations

      - name: Log Migration Success
        run: echo "✅ QA database migration completed successfully"

  migrate-prod:
    if: github.ref == 'refs/heads/Campus-DB-Prod'
    runs-on: ubuntu-latest
    environment: production    # Adds manual approval requirement before running
    steps:
      - uses: actions/checkout@v4

      - name: Run Flyway Migration on PROD
        uses: flyway/flyway-action@v1
        with:
          args: migrate
        env:
          FLYWAY_URL: jdbc:mysql://${{ secrets.PROD_DB_HOST }}:3306/${{ secrets.PROD_DB_NAME }}?ssl-mode=REQUIRED
          FLYWAY_USER: ${{ secrets.PROD_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          FLYWAY_LOCATIONS: filesystem:./db/migrations

      - name: Log Migration Success
        run: echo "✅ PROD database migration completed successfully"
